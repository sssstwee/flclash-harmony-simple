name: Clash Harmony

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harmony-simple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed secrets
        run: bash .github/scripts/check-no-secrets.sh

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            app:
              - '**'
              - '!backend/**'

  backend:
    needs: [changes, secrets-scan]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check

  build:
    needs: [changes, backend, secrets-scan]
    if: |
      always() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load pinned gitcode SHAs
        run: grep -v '^#' .github/harmony-pinned-shas.env >> "$GITHUB_ENV"

      - name: Set up HarmonyOS SDK
        uses: ErBWs/setup-ohos@v2.0.0
        with:
          version: 26.0.0.821
          cache: true

      - name: Set up HarmonyOS Flutter
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TOOL_CACHE/flutter-ohos"
          rm -rf "$FLUTTER_DIR"
          mkdir -p "$FLUTTER_DIR"
          git -C "$FLUTTER_DIR" init
          git -C "$FLUTTER_DIR" remote add origin https://gitcode.com/CPF-Flutter/flutter_flutter.git
          git -C "$FLUTTER_DIR" fetch --depth 1 origin "$FLUTTER_OHOS_SHA"
          git -C "$FLUTTER_DIR" checkout FETCH_HEAD
          git -C "$FLUTTER_DIR" tag 3.44.10
          git -C "$FLUTTER_DIR" apply "$GITHUB_WORKSPACE/.github/flutter_ohos.patch"
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_DIR/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Cache Dart dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: harmony-flutter-3.44.10-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: harmony-flutter-3.44.10-${{ runner.os }}-

      - name: Install dependencies
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Set up Go bootstrap
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Set up HarmonyOS Go
        run: |
          set -euo pipefail
          OHOS_GO_DIR="$RUNNER_TOOL_CACHE/ohos-go"
          rm -rf "$OHOS_GO_DIR"
          mkdir -p "$OHOS_GO_DIR"
          git -C "$OHOS_GO_DIR" init
          git -C "$OHOS_GO_DIR" remote add origin https://gitcode.com/openharmony-sig/ohos_golang_go.git
          git -C "$OHOS_GO_DIR" fetch --depth 1 origin "$OHOS_GO_SHA"
          git -C "$OHOS_GO_DIR" checkout FETCH_HEAD
          git -C "$OHOS_GO_DIR" log -1 --format='OHOS Go commit: %H %s'
          cd "$OHOS_GO_DIR/src"
          ./make.bash
          echo "GOROOT=$OHOS_GO_DIR" >> "$GITHUB_ENV"
          echo "$OHOS_GO_DIR/bin" >> "$GITHUB_PATH"

      - name: Build unsigned HarmonyOS packages
        env:
          CLASH_HARMONY_API_URL: ${{ vars.CLASH_HARMONY_API_URL }}
        run: |
          set -euo pipefail
          API_URL="${CLASH_HARMONY_API_URL:-https://auth.example.com}"
          cp env.json.example env.json
          API_URL="$API_URL" python3 - <<'PY'
          import json, os
          with open("env.json") as f:
              data = json.load(f)
          data["CLASH_HARMONY_API_URL"] = os.environ["API_URL"]
          with open("env.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          dart setup.dart ohos --env stable -v

      - name: Checksums
        run: |
          cd dist
          find . -type f \( -name '*.hap' -o -name '*.app' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Resolve package artifact name
        id: pkg
        run: |
          SHORT="${GITHUB_SHA::7}"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if [[ "$BRANCH" == "cursor/zero-config-harmony-proxy-31c4" ]]; then
            echo "name=Clash-Harmony-cursor-pr3-${SHORT}" >> "$GITHUB_OUTPUT"
          else
            echo "name=Clash-Harmony-HarmonyOS-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
