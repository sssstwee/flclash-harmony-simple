name: Clash Harmony

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harmony-simple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            app:
              - '**'
              - '!backend/**'

  backend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check

  build:
    needs: [changes, backend]
    if: |
      always() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive

      - name: Load pinned gitcode SHAs
        run: grep -v '^#' .github/harmony-pinned-shas.env >> "$GITHUB_ENV"

      - name: Set up HarmonyOS SDK
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2.0.0
        with:
          version: 26.0.0.821
          cache: true

      - name: Set up HarmonyOS Flutter
        run: |
          git clone https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TOOL_CACHE/flutter-ohos"
          git -C "$RUNNER_TOOL_CACHE/flutter-ohos" checkout "$FLUTTER_OHOS_SHA"
          git -C "$RUNNER_TOOL_CACHE/flutter-ohos" tag 3.44.10
          git -C "$RUNNER_TOOL_CACHE/flutter-ohos" apply "$GITHUB_WORKSPACE/.github/flutter_ohos.patch"
          echo "$RUNNER_TOOL_CACHE/flutter-ohos/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TOOL_CACHE/flutter-ohos/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Cache Dart dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.pub-cache
          key: harmony-flutter-3.44.10-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: harmony-flutter-3.44.10-${{ runner.os }}-

      - name: Install dependencies
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Set up Go bootstrap
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Cache HarmonyOS Go toolchain
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        id: ohos-go-cache
        with:
          path: ${{ runner.tool_cache }}/ohos-go
          key: ohos-go-${{ env.OHOS_GO_SHA }}-${{ runner.os }}

      - name: Set up HarmonyOS Go
        if: steps.ohos-go-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://gitcode.com/openharmony-sig/ohos_golang_go.git "$RUNNER_TOOL_CACHE/ohos-go"
          git -C "$RUNNER_TOOL_CACHE/ohos-go" checkout "$OHOS_GO_SHA"
          cd "$RUNNER_TOOL_CACHE/ohos-go/src"
          ./make.bash

      - name: Export HarmonyOS Go
        run: |
          echo "GOROOT=$RUNNER_TOOL_CACHE/ohos-go" >> "$GITHUB_ENV"
          echo "$RUNNER_TOOL_CACHE/ohos-go/bin" >> "$GITHUB_PATH"

      - name: Build unsigned HarmonyOS packages
        run: dart setup.dart ohos --env stable -v

      - name: Checksums
        run: |
          cd dist
          find . -type f \( -name '*.hap' -o -name '*.app' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: Clash-Harmony-HarmonyOS-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
